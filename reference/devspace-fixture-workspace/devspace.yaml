version: v2beta1
name: piphony-devspace-fixture

images:
  frontend:
    image: piphony/devspace-fixture-frontend
    context: /Users/nisar/Workspace/piphony/reference/devspace-fixture-frontend
    dockerfile: /Users/nisar/Workspace/piphony/reference/devspace-fixture-frontend/Dockerfile
    docker:
      preferMinikube: true
    skipPush: true
  gateway:
    image: piphony/devspace-fixture-gateway
    context: /Users/nisar/Workspace/piphony/reference/devspace-fixture-gateway
    dockerfile: /Users/nisar/Workspace/piphony/reference/devspace-fixture-gateway/Dockerfile
    docker:
      preferMinikube: true
    skipPush: true
  backend:
    image: piphony/devspace-fixture-backend
    context: /Users/nisar/Workspace/piphony/reference/devspace-fixture-backend
    dockerfile: /Users/nisar/Workspace/piphony/reference/devspace-fixture-backend/Dockerfile
    docker:
      preferMinikube: true
    skipPush: true

deployments:
  fixture:
    kubectl:
      inlineManifest: |-
        apiVersion: v1
        kind: Secret
        metadata:
          name: postgres-auth
        type: Opaque
        stringData:
          POSTGRES_DB: fixturedb
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: postgres
          labels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: postgres
          template:
            metadata:
              labels:
                app.kubernetes.io/name: postgres
                app.kubernetes.io/part-of: piphony-devspace-fixture
            spec:
              containers:
                - name: postgres
                  image: postgres:16-alpine
                  imagePullPolicy: IfNotPresent
                  ports:
                    - containerPort: 5432
                  envFrom:
                    - secretRef:
                        name: postgres-auth
                  readinessProbe:
                    exec:
                      command:
                        - sh
                        - -c
                        - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  volumeMounts:
                    - name: postgres-data
                      mountPath: /var/lib/postgresql/data
              volumes:
                - name: postgres-data
                  emptyDir: {}
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: postgres
          labels:
            app.kubernetes.io/name: postgres
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          selector:
            app.kubernetes.io/name: postgres
          ports:
            - name: postgres
              port: 5432
              targetPort: 5432
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: backend
          labels:
            app.kubernetes.io/name: backend
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: backend
          template:
            metadata:
              labels:
                app.kubernetes.io/name: backend
                app.kubernetes.io/part-of: piphony-devspace-fixture
            spec:
              containers:
                - name: backend
                  image: ${runtime.images.backend}
                  imagePullPolicy: IfNotPresent
                  ports:
                    - containerPort: 8000
                  env:
                    - name: DATABASE_URL
                      value: postgresql://fixture:fixture@postgres:5432/fixturedb
                    - name: SEED_TITLE
                      value: Ship release checklist
                  readinessProbe:
                    httpGet:
                      path: /healthz
                      port: 8000
                    initialDelaySeconds: 5
                    periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: backend
          labels:
            app.kubernetes.io/name: backend
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          selector:
            app.kubernetes.io/name: backend
          ports:
            - name: http
              port: 8000
              targetPort: 8000
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: gateway
          labels:
            app.kubernetes.io/name: gateway
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: gateway
          template:
            metadata:
              labels:
                app.kubernetes.io/name: gateway
                app.kubernetes.io/part-of: piphony-devspace-fixture
            spec:
              containers:
                - name: gateway
                  image: ${runtime.images.gateway}
                  imagePullPolicy: IfNotPresent
                  ports:
                    - containerPort: 4000
                  env:
                    - name: BACKEND_BASE_URL
                      value: http://backend:8000
                  readinessProbe:
                    tcpSocket:
                      port: 4000
                    initialDelaySeconds: 5
                    periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: gateway
          labels:
            app.kubernetes.io/name: gateway
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          selector:
            app.kubernetes.io/name: gateway
          ports:
            - name: http
              port: 4000
              targetPort: 4000
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: frontend
          labels:
            app.kubernetes.io/name: frontend
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: frontend
          template:
            metadata:
              labels:
                app.kubernetes.io/name: frontend
                app.kubernetes.io/part-of: piphony-devspace-fixture
            spec:
              containers:
                - name: frontend
                  image: ${runtime.images.frontend}
                  imagePullPolicy: IfNotPresent
                  ports:
                    - containerPort: 3000
                  env:
                    - name: GATEWAY_GRAPHQL_URL
                      value: http://gateway:4000/
                  readinessProbe:
                    httpGet:
                      path: /healthz
                      port: 3000
                    initialDelaySeconds: 5
                    periodSeconds: 5
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: frontend
          labels:
            app.kubernetes.io/name: frontend
            app.kubernetes.io/part-of: piphony-devspace-fixture
        spec:
          selector:
            app.kubernetes.io/name: frontend
          ports:
            - name: http
              port: 3000
              targetPort: 3000
